<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#5b4bff" />
  <title>EmiteAI API — Documentação Swagger</title>
  <link rel="stylesheet" type="text/css" href="/api/swagger-ui/swagger-ui.css" />
  <link rel="icon" type="image/png" href="/api/swagger-ui/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/api/swagger-ui/favicon-16x16.png" sizes="16x16" />
  <style>
    html { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .topbar { display: none; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/api/swagger-ui/swagger-ui-bundle.js"></script>
  <script src="/api/swagger-ui/swagger-ui-standalone-preset.js"></script>
  <script src="/api/swagger-ui/swagger-initializer.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "/api/api-docs",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: "StandaloneLayout",
        validatorUrl: null,
        tryItOutEnabled: true,
        filter: true,
        docExpansion: "list",
        displayRequestDuration: true,
        oauth2RedirectUrl: "/api/swagger-ui/oauth2-redirect.html"
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
