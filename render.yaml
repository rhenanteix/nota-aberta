services:
  - type: web
    name: nota-aberta
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NOTA_DB
        value: /data/contas.db
      - key: NOTA_BASE_URL
        value: https://nota-aberta.onrender.com
      - key: NOTA_SEGREDO_SESSAO
        sync: false
      - key: NOTA_CHAVE_MESTRA
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NOTA_PRODUCAO
        value: "1"
    disk:
      name: nota-aberta-dados
      mountPath: /data
      sizeGB: 1